server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SvelteKit client routing – fallback to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to the backend running on the host at :8081
  location /api/ {
    # backend base URL: http://localhost:8081/api/ (from the host)
    proxy_pass http://host.docker.internal:8081/api/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
